name: Build signed Play Store AAB

on:
  workflow_dispatch:
    inputs:
      publish_internal:
        description: 'Manually upload this signed AAB to Google Play INTERNAL testing (not production)'
        type: boolean
        default: false
  push:
    branches: [android-only-app]

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ANDROID_DISTRIBUTION: play
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify project
        run: npm run check

      - name: Generate native Android project
        run: npx cap add android

      - name: Build and sync assets
        run: npm run android:sync

      - name: Verify no website Buy button exists in Play assets
        run: node android-support/verify-play-bundle.mjs

      - name: Verify Android target/minimum SDKs
        run: node android-support/check-generated-sdk.mjs

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/psctaiyari-upload.jks"

      - name: Configure release signing and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ runner.temp }}/psctaiyari-upload.jks
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import json
          required = ['KEYSTORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS', 'KEYSTORE_PATH']
          if any(not os.environ.get(k) for k in required):
              raise SystemExit('Missing Android signing secret(s)')
          # Inject configuration after Capacitor generates its native project.
          gradle = Path('android/app/build.gradle')
          if not gradle.exists():
              raise SystemExit('Capacitor did not generate android/app/build.gradle')
          gradle.write_text(gradle.read_text() + """
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('RELEASE_VERSION_CODE'))
                  versionName '1.0.' + System.getenv('RELEASE_VERSION_CODE')
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """)
          PY

      - name: Build signed release bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ runner.temp }}/psctaiyari-upload.jks
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSC-Taiyari-Play-Store-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Manual opt-in only: an ordinary code push NEVER publishes to Google Play.
      - name: Require Play API credentials for internal testing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_internal == true }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret and Play API setup"; exit 1; }

      - name: Upload signed AAB to Google Play internal testing only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_internal == true }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nextlayers.psctaiyari
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
