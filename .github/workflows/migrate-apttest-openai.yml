name: Migrate AptTest RAG to OpenAI

on:
  workflow_dispatch:
    inputs:
      migrate_existing:
        description: Re-embed all current aptTest records
        type: boolean
        default: true
      upsert_new_chunks:
        description: Upsert the 20 new visual-MCQ chunks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RAG_NEW_CHUNKS_JSON: ${{ secrets.RAG_NEW_CHUNKS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "chromadb==1.5.9" "openai>=1.0,<3"

      - name: Migrate and upsert
        run: |
          ARGS=""
          if [ "${{ inputs.migrate_existing }}" = "true" ]; then
            ARGS="$ARGS --migrate-existing"
          fi
          if [ "${{ inputs.upsert_new_chunks }}" = "true" ]; then
            ARGS="$ARGS --upsert-new-chunks"
          fi
          python scripts/migrate_apttest_to_openai.py $ARGS
