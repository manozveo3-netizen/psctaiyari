name: Migrate AptTest RAG to OpenAI

on:
  workflow_dispatch:
    inputs:
      migrate_existing:
        description: Re-embed all current aptTest records (run once)
        type: boolean
        default: false
      new_chunks_storage_path:
        description: JSON batch path in the private Images bucket
        type: string
        required: true

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "chromadb==1.5.9" "openai>=1.0,<3" "requests>=2.31,<3"

      - name: Migrate and upsert
        run: |
          if [ "${{ inputs.migrate_existing }}" = "true" ]; then
            python scripts/migrate_apttest_to_openai.py \
              --migrate-existing \
              --new-chunks-storage-path "${{ inputs.new_chunks_storage_path }}"
          else
            python scripts/migrate_apttest_to_openai.py \
              --new-chunks-storage-path "${{ inputs.new_chunks_storage_path }}"
          fi
