name: Build Android debug APK

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'play (no checkout) or direct (website Buy button, NOT for Google Play)'
        type: choice
        options:
          - play
          - direct
        default: play
  push:
    branches: [android-only-app]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ANDROID_DISTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && inputs.distribution == 'direct' && 'direct' || 'play' }}
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create native Android project
        run: npx cap add android

      - name: Build and sync web assets into Android
        run: npm run android:sync

      - name: Verify Android target/minimum SDKs
        run: node android-support/check-generated-sdk.mjs

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSC-Taiyari-${{ env.VITE_ANDROID_DISTRIBUTION }}-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
