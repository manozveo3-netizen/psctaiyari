name: Deploy PSC Taiyari

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Update VPS and build website
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: myadmin
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/myadmin/psctaiyari
            # The VPS is a deployment copy; GitHub main is the source of truth.
            # This avoids failed pulls when an old local commit exists on the VPS.
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
