name: Deploy PSC Taiyari

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Avoid overlapping deployments for rapid successive commits.
concurrency:
  group: psctaiyari-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Update VPS and build website
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: myadmin
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            # The VPS-side lock protects against overlapping remote processes,
            # including SSH runs left running after a cancelled workflow.
            flock -w 600 /tmp/psctaiyari-deploy.lock bash -se <<'DEPLOY'
            set -eu
            cd /home/myadmin/psctaiyari
            git fetch origin main
            git reset --hard origin/main
            rm -rf node_modules
            # Use a fresh dedicated cache to avoid stale/corrupted npm tarballs.
            npm ci --cache /tmp/psctaiyari-npm-cache --prefer-online --no-audit --no-fund
            npm run build
            DEPLOY
